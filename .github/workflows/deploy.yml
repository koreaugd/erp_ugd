name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Run on push to main or master branch

# Allow this job to run in parallel or queue up
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install and Build 🔧
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL || vars.VITE_GAS_URL }}
        run: |
          npm ci || npm install
          npx vite build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Folder to publish
          branch: gh-pages # Build output branch
          # 옛 빌드의 파일을 지우지 않는다.
          # 지점은 ERP를 하루 종일 열어두고 밤에 마감한다. 그 화면은 열던 시점의 파일 이름
          # (firebaseDirect-a1b2c3.js)을 기억하는데, clean: true 로 지워버리면 제출을 누르는
          # 순간 없는 파일을 달라고 하게 되어 마감이 막힌다. 남겨두면 옛 화면도 그대로 동작한다.
          clean: false
          single-commit: true
